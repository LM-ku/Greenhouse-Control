<!DOCTYPE HTML><html><head>
  <title>БОЛЬШАЯ ТЕПЛИЦА. АВТОРИЗАЦИЯ</title>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <link rel='icon' href='data:,'>
  <link rel="stylesheet" href="style.css">  
</head>
<body>
  <div class='card'>
  <h3 class="card-title">АВТОРИЗАЦИЯ</h3>  
  <form method='POST' action='/login'>
    <input type='hidden' name='redirect' value='%REDIRECT%'>	
    <div class='form-group'>
      <label>Имя пользователя:</label>
      <input type='text' id='ssid' name='username' placeholder='Enter username' required>
    </div>
    <div class='form-group'>
      <label>Пароль:</label>
      <input type='password' name='password' placeholder='Enter password' required>
    </div>
    <div class='buttons'>	
      <button type='button' onclick='window.location.href="/logout"' class='button secondary'>ОТМЕНА</button>	
      <button type='submit' class='button success'>OK</button>
	</div>	   
  </form>
  <div class='error'>%ERROR%</div>
  </div>
  <script>
    function Logout() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "logout", true);
      xhr.send();
      setTimeout(function(){ window.open("/","_self"); }, 1000);
    };
  </script> 
</body>
</html>
