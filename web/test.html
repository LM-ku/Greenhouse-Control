<!DOCTYPE HTML>
<html>
<head>
  <title>БОЛЬШАЯ ТЕПЛИЦА. ПОЛИВ</title>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <link rel='icon' href='data:,'>
  <link rel='stylesheet' href='style1.css'>
  
 <style>
	.days-grid {
      display: grid;
      grid-template-columns: 120px repeat(7, 1fr);
      align-items: center;
      margin-bottom: 15px;
    }
    .days-label {
      grid-column: 1;
    }
    .day-header {
      text-align: center;
      font-weight: bold;
      font-size: 0.9em;
      padding-bottom: 5px;
    }
    .day-checkbox {
      text-align: center;
    }
  </style>  
  
</head>
<body>
  <div class='card'>
    <span class='data-time' id='date_time'>%DATE_TIME%</span>
    <h3 class='card-title'>ПОЛИВ В ТЕПЛИЦЕ. ИНФОРМАЦИЯ</h3>
    <table class='info-table'>
      <tr>
        <td>Клапан полива:</td>
        <td><span id='watering_state'>%WATERING_STATE%</span></td>
      </tr>	  
	</table>
  </div>
  
  <div class='card'>
    <h3 class='card-title'>ПОЛИВ В ТЕПЛИЦЕ. УПРАВЛЕНИЕ</h3>
    <div class='form-group'>
      <label>Режим работы:</label>
	  <form action='/watering_mode_set' style="display:inline">
	    <button id='/watering_mode' class='button primary large'>%WATERING_MODE%</button>
	  </form>
    </div>
	<span id='pump_man'>
	  %WATERING_MAN%
	  <!--div class='button-group'>
        <form action='/watering_off' style='flex:1'><button class='button cancel large'>ВЫКЛЮЧИТЬ</button></form>
		<form action='/watering_on' style='flex:1'><button class='button execute large'>ВКЛЮЧИТЬ</button></form>
      </div-->
	</span>
  </div>

  <div class='card'>
    <h3 class='card-title'>НАСТРОЙКИ РЕЖИМА "АВТО"</h3>
    <!--form action='/watering' method='POST' style="width:100 &#37;"-->
    <form action='/watering' method='POST' class="large">  

      <div class='form-row'>
        <div class='form-label'>Канал контроллера 'Aquarius' (7 ... 9)</div>
        <input type='number' name='W_AQUARIUS_CH' class='value-input' pattern='[0,7-9]{1}' value='%W_AQUARIUS_CH%'>
        <span>, иначе ...</span>
      </div>

      <!-- Сетка с днями недели -->
      <div class="days-grid">
        <!-- Пустая ячейка для выравнивания -->
        <div class="days-label"></div>
        
        <!-- Заголовки дней -->
        <div class="day-header">ПН</div>
        <div class="day-header">ВТ</div>
        <div class="day-header">СР</div>
        <div class="day-header">ЧТ</div>
        <div class="day-header">ПТ</div>
        <div class="day-header">СБ</div>
        <div class="day-header">ВС</div>
        
        <!-- Чекбоксы -->
        <div class="days-label">Дни полива:</div>
        <div class="day-checkbox"><input type="checkbox" name="mon" id="mon"></div>
        <div class="day-checkbox"><input type="checkbox" name="tue" id="tue"></div>
        <div class="day-checkbox"><input type="checkbox" name="wed" id="wed"></div>
        <div class="day-checkbox"><input type="checkbox" name="thu" id="thu"></div>
        <div class="day-checkbox"><input type="checkbox" name="fri" id="fri"></div>
        <div class="day-checkbox"><input type="checkbox" name="sat" id="sat"></div>
        <div class="day-checkbox"><input type="checkbox" name="sun" id="sun"></div>
      </div>
 
      <div class='form-row'>
        <div class='form-label'>Начинать полив в</div>
        <div class='time-inputs'>
          <input type='number' name='W_START_HOUR' class='time-input' value='%W_START_HOUR%'>
          <span>ч.</span>
          <input type='number' name='W_START_MINUTE' class='time-input' value='%W_START_MINUTE%'>
          <span>мин.</span>
        </div>
      </div>

      <div class='form-row'>
        <div class='form-label'>Продолжительность полива</div>
        <input type='number' name='W_RUN_TIME' class='value-input' value='%W_RUN_TIME%'>
        <span>мин.</span>
      </div>

      <div class='button-group'>
        <button type='button'  onclick='window.location.reload()' class='button secondary'>ОТМЕНА</button>
        <button type='submit' class='button primary'>СОХРАНИТЬ</button> 
	  </div>

     </form>
  </div>

  <div class='button-group'>
    <form action='/' style='flex:1'>
      <button class='button primary large'>НА ГЛАВНЫЙ ЭКРАН</button>
    </form>
  </div>


 

<script>

  fetch('/getdays')
    .then(r => r.text())
    .then(mask => {
      const bits = parseInt(mask);
      if (bits & 1) document.getElementById('mon').checked = true;
      if (bits & 2) document.getElementById('tue').checked = true;
      if (bits & 4) document.getElementById('wed').checked = true;
      if (bits & 8) document.getElementById('thu').checked = true;
      if (bits & 16) document.getElementById('fri').checked = true;
      if (bits & 32) document.getElementById('sat').checked = true;
      if (bits & 64) document.getElementById('sun').checked = true;
    });

  setInterval(function ( ) {
    var xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
      if (this.readyState == 4 && this.status == 200) {
        document.getElementById('date_time').innerHTML = this.responseText;
      }
    };
    xhttp.open('GET', '/date_time', true);
    xhttp.send();
  }, 1000 ) ;

  setInterval(function ( ) {
    var xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
      if (this.readyState == 4 && this.status == 200) {
        document.getElementById('watering_state').innerHTML = this.responseText;
      }
    };
    xhttp.open('GET', '/watering_state', true);
    xhttp.send();
  }, 2000 ) ;   
   
 setInterval(function ( ) {
    var xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
      if (this.readyState == 4 && this.status == 200) {
        document.getElementById('watering_mode').innerHTML = this.responseText;
      }
    };
    xhttp.open('GET', '/watering_mode', true);
    xhttp.send();
  }, 2000 ) ;    
    
 setInterval(function ( ) {
    var xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
      if (this.readyState == 4 && this.status == 200) {
        document.getElementById('watering_man').innerHTML = this.responseText;
      }
    };
    xhttp.open('GET', '/watering_man', true);
    xhttp.send();
  }, 2000 ) ;   
    	
function switch_day0() {
    var request = new XMLHttpRequest();
    request.open('GET', '/watering_day0', false);
    request.send();
  }; 

function switch_day1() {
    var request = new XMLHttpRequest();
    request.open('GET', '/watering_day1', false);
    request.send();
  }; 		
		
function switch_day2() {
    var request = new XMLHttpRequest();
    request.open('GET', '/watering_day2', false);
    request.send();
  }; 		
		
function switch_day3() {
    var request = new XMLHttpRequest();
    request.open('GET', '/watering_day3', false);
    request.send();
  }; 		
		
function switch_day4() {
    var request = new XMLHttpRequest();
    request.open('GET', '/watering_day4', false);
    request.send();
  }; 		
		
function switch_day5() {
    var request = new XMLHttpRequest();
    request.open('GET', '/watering_day5', false);
    request.send();
  }; 		
		
function switch_day6() {
    var request = new XMLHttpRequest();
    request.open('GET', '/watering_day6', false);
    request.send();
  }; 		

  function homeButton() {
	var xhr = new XMLHttpRequest();
	xhr.open("GET", "logout", true);
	xhr.send();
	setTimeout(function(){ window.open("/","_self"); }, 1000);
  };
  
</script>
</body>
</html>
